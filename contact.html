<body>
  <header class="page-head">

  <main class="contact-grid">
    <section class="sheet">
      <h2>Send a Message</h2>
      <form id="contactForm">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Type your message..." required></textarea>

        <button class="btn" type="submit">Send Message</button>
      </form>
      <p id="result" class="result" aria-live="polite"></p>
    </section>

    <aside class="sheet contact-aside">
      <p class="eyebrow">CONTACT INFORMATION</p>
      <h2>Get in touch.</h2>
      <div class="detail"><small>EMAIL ADDRESS</small><a href="mailto:ruchithgowda2006@gmail.com">ruchithgowda2006@gmail.com</a></div>
      <div class="detail"><small>LOCATION</small><p>Belthangady, Dakshina Kannada, Karnataka</p></div>
    </aside>
  </main>

  <footer><p>© 2026 K Ruchith Kumar <span>—</span> Contact</p></footer>
